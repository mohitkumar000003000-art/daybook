  <style>
    /* Aggressively suppress any injected platform badge, drawer, or iframe (e.g. Powered by Netlify) */
    iframe,
    iframe[src*="netlify"],
    iframe[id*="netlify"],
    iframe[class*="netlify"],
    netlify-drawer,
    #netlify-badge,
    .netlify-badge,
    #nl-badge,
    .nl-badge,
    [data-netlify-deploy-id],
    [aria-label*="Netlify" i],
    [aria-label*="Powered by Netlify" i],
    [class*="netlify" i],
    [id*="netlify" i],
    div[style*="z-index: 10000"],
    div[style*="z-index: 99999"],
    div[style*="z-index: 2147483647"],
    div[style*="z-index: 2147483646"] {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
      width: 0 !important;
      height: 0 !important;
      max-width: 0 !important;
      max-height: 0 !important;
      position: fixed !important;
      bottom: -9999px !important;
      right: -9999px !important;
      left: -9999px !important;
      clip: rect(0, 0, 0, 0) !important;
      clip-path: inset(100%) !important;
      transform: scale(0) !important;
    }
  </style>

  <script>
    (function() {
      // 1. Intercept createElement to prevent any iframe or netlify element from being created
      try {
        const origCreate = document.createElement.bind(document);
        document.createElement = function(tag, opts) {
          const t = String(tag || '').toLowerCase();
          if (t === 'iframe' || t === 'netlify-drawer') {
            const dummy = origCreate('span');
            dummy.style.display = 'none';
            dummy.setAttribute('aria-hidden', 'true');
            return dummy;
          }
          return origCreate(tag, opts);
        };
      } catch (e) {}

      // 2. Set Netlify's local preference to hidden
      try {
        localStorage.setItem('nl-hud:public:v1', 'hidden');
        localStorage.setItem('netlify-badge-dismissed', 'true');
      } catch (e) {}

      // 3. Continuous eradication
      function killBadges() {
        try {
          document.querySelectorAll('iframe, netlify-drawer, [id*="netlify" i], [class*="netlify" i], [aria-label*="netlify" i]').forEach(function(el) {
            el.remove();
          });
          document.querySelectorAll('div, a, button, footer, span').forEach(function(el) {
            const txt = (el.innerText || el.textContent || '').trim().toLowerCase();
            if (txt.includes('powered by netlify') || txt === 'netlify' || (txt.includes('powered by') && txt.includes('netlify'))) {
              el.remove();
            }
          });
          document.querySelectorAll('*').forEach(function(el) {
            if (el.shadowRoot) {
              const shadowBadge = el.shadowRoot.querySelector('iframe, [aria-label*="Netlify" i], .netlify-badge, a[href*="netlify"]');
              if (shadowBadge) {
                el.remove();
              }
            }
          });
        } catch (e) {}
      }

      killBadges();
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', killBadges);
      }
      window.addEventListener('load', killBadges);
      new MutationObserver(killBadges).observe(document.documentElement, { childList: true, subtree: true });
      setInterval(killBadges, 250);
    })();
  </script>
