<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Daybook is a private, modern daily planner and personal journaling website designed for intentional living, daily schedules, and reflective writing." />
  <title>Daybook — Daily Planner & Journal</title>

  <!-- Typography: Newsreader (Editorial Serif) & Plus Jakarta Sans (UI Sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/sidebar.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/tasks.css" />
  <link rel="stylesheet" href="css/journal.css" />
  <link rel="stylesheet" href="css/calendar.css" />
  <link rel="stylesheet" href="css/daily-plan.css" />
  <link rel="stylesheet" href="css/progress.css" />
  <link rel="stylesheet" href="css/animations.css" />

  <style>
    /* Suppress Netlify badge and drawer injection */
    netlify-drawer,
    #netlify-badge,
    .netlify-badge,
    [data-netlify-deploy-id],
    [aria-label*="Netlify"],
    [class*="netlify"],
    div[style*="z-index: 10000"],
    div[style*="z-index: 99999"] {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
      height: 0 !important;
      width: 0 !important;
      position: fixed !important;
      bottom: -9999px !important;
      right: -9999px !important;
    }
  </style>
</head>
<body>
  <!-- Mobile Header Bar -->
  <div class="mobile-top-bar">
    <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Open Navigation Menu">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="mobile-brand">
      <span class="brand-monogram">D</span>
      <span class="brand-name">Daybook</span>
    </div>
  </div>

  <!-- App Main Wrapper -->
  <div class="app-layout">
    <!-- Sidebar Backdrop for Mobile -->
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <!-- Navigation Sidebar -->
    <aside class="app-sidebar" id="app-sidebar">
      <div class="sidebar-top">
        <!-- Brand Header -->
        <div class="brand-header">
          <div class="brand-logo-wrap">
            <svg class="brand-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
            </svg>
          </div>
          <div class="brand-titles">
            <h1 class="brand-name">Daybook</h1>
            <span class="brand-tagline">Planner & Journal</span>
          </div>
        </div>

        <!-- Quick Action Sidebar CTAs -->
        <div class="sidebar-quick-actions">
          <button class="btn btn-primary sidebar-action-btn" id="sidebar-new-task-btn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            New Task
          </button>
          <button class="btn btn-secondary sidebar-action-btn" id="sidebar-new-journal-btn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            Write Entry
          </button>
        </div>

        <!-- Navigation Menu -->
        <nav class="sidebar-nav" aria-label="Main Navigation">
          <button class="sidebar-nav-btn active" data-nav="dashboard">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            </span>
            <span class="nav-label">Dashboard</span>
          </button>

          <button class="sidebar-nav-btn" data-nav="plan">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
            </span>
            <span class="nav-label">Daily Plan & MITs</span>
          </button>

          <button class="sidebar-nav-btn" data-nav="journal">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            </span>
            <span class="nav-label">Personal Journal</span>
          </button>

          <button class="sidebar-nav-btn" data-nav="tasks">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
            </span>
            <span class="nav-label">My Tasks</span>
          </button>

          <button class="sidebar-nav-btn" data-nav="calendar">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            </span>
            <span class="nav-label">Calendar</span>
          </button>

          <button class="sidebar-nav-btn" data-nav="progress">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
            </span>
            <span class="nav-label">Progress & Insights</span>
          </button>

          <button class="sidebar-nav-btn" data-nav="settings">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </span>
            <span class="nav-label">Settings</span>
          </button>
        </nav>
      </div>

      <!-- Sidebar Footer -->
      <div class="sidebar-footer">
        <div class="user-chip" id="sidebar-user-chip" role="button" tabindex="0" title="Manage Google Account & Profile">
          <div class="user-avatar" id="sidebar-user-avatar">A</div>
          <div class="user-info">
            <span class="user-name" id="sidebar-user-name">Alex's Daybook</span>
            <span class="user-privacy-tag" id="sidebar-user-status">Sign in with Google</span>
          </div>
        </div>

        <button class="theme-toggle-btn" id="sidebar-theme-toggle" title="Toggle Light / Dark Mode" aria-label="Toggle theme">
          <span id="sidebar-theme-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </span>
        </button>
      </div>
    </aside>

    <!-- Main Dynamic Content Region -->
    <main class="app-main-content">
      <div id="main-view-container"></div>
    </main>
  </div>

  <!-- Mobile Bottom Navigation (Visible on phones/small screens) -->
  <nav class="mobile-bottom-nav" id="mobile-bottom-nav" aria-label="Mobile Navigation">
    <button class="mobile-nav-item active" data-nav="dashboard" aria-label="Dashboard">
      <span class="m-nav-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      </span>
      <span class="m-nav-label">Home</span>
    </button>

    <button class="mobile-nav-item" data-nav="plan" aria-label="Daily Plan">
      <span class="m-nav-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
      </span>
      <span class="m-nav-label">Plan</span>
    </button>

    <button class="mobile-nav-item mobile-nav-quick-add" id="mobile-quick-action-btn" aria-label="Quick Add">
      <span class="m-nav-quick-plus">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </span>
    </button>

    <button class="mobile-nav-item" data-nav="tasks" aria-label="Tasks">
      <span class="m-nav-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      </span>
      <span class="m-nav-label">Tasks</span>
    </button>

    <button class="mobile-nav-item" data-nav="journal" aria-label="Journal">
      <span class="m-nav-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      </span>
      <span class="m-nav-label">Journal</span>
    </button>
  </nav>

  <!-- Entry Script -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
